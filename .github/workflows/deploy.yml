name: Deploy Argus

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: '.bootstrap-scaffold.csproj'
  PUBLISH_PATH: '${{ github.workspace }}/publish'
  # Future MarketData provider settings are deployment configuration only.
  # They must be supplied through App Service configuration or Key Vault after
  # the readiness record in docs/market-data.md has been approved.

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "$PROJECT_PATH"

      - name: Build
        run: dotnet build "$PROJECT_PATH" --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Argus.Authentication.Tests/Argus.Authentication.Tests.csproj --configuration Release

      - name: Publish
        run: dotnet publish "$PROJECT_PATH" --configuration Release --no-restore --output "$PUBLISH_PATH"

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_PATH }}
      # Do not add provider credentials or echo secret values here. Future
      # MarketData:* settings belong in Azure App Service configuration/
      # Key Vault references and must not be provisioned by this workflow
      # before the provider readiness gate is approved.
